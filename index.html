<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lego Dreamer</title>
<style>
:root{--bg:#f6c10f;--card:#fff;--tx:#161616;--mut:#5c5c5c;--red:#f01e00;--yel:#f6c10f;--blu:#0b92d6;--bd:#161616;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1600;--card:#262626;--tx:#f2f2f2;--mut:#b5b5b5;--bd:#f6c10f}}
:root[data-theme="dark"]{--bg:#1c1600;--card:#262626;--tx:#f2f2f2;--mut:#b5b5b5;--bd:#f6c10f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:640px;margin:auto;padding:12px}
header{display:flex;align-items:center;gap:12px}
.logo{width:64px;height:64px;border-radius:12px;border:3px solid #161616;object-fit:cover;flex:none}
header b{font-size:26px;line-height:1;color:var(--red);font-weight:900;letter-spacing:-.5px;text-shadow:2px 2px 0 #161616}
header small{display:block;color:var(--tx);font-weight:700;margin-top:3px}
.chip{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid #161616;border-radius:99px;padding:3px 12px 3px 3px;font-weight:800;font-size:14px;cursor:pointer;color:var(--tx);max-width:50%}
.chip .a{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--yel);display:flex;align-items:center;justify-content:center;flex:none}
.chip i{display:block;font-style:normal;font-weight:600;font-size:11px;color:var(--mut)}
.chip span.t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (min-width:900px){body{max-width:1120px;padding:24px 32px}.logo{width:84px;height:84px}header b{font-size:36px}nav{max-width:460px}#app{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}.grid{grid-template-columns:repeat(3,1fr)}.chip{font-size:16px}.chip .a{width:44px;height:44px}}
nav{display:flex;gap:6px;margin:12px 0}
nav button{flex:1;padding:10px;border:3px solid #161616;background:var(--blu);color:#fff;border-radius:8px;font-weight:800;box-shadow:0 4px 0 #161616}
nav button.on{background:var(--red);transform:translateY(2px);box-shadow:0 2px 0 #161616}
.card{background:var(--card);border:3px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 var(--bd)}
.row{display:flex;gap:12px;align-items:center}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
input,select,textarea{width:100%;padding:10px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
button.b{background:var(--red);color:#fff;border:3px solid #161616;border-radius:8px;padding:9px 14px;font-weight:800;box-shadow:0 3px 0 #161616}
button.s{background:var(--blu);border:2px solid #161616;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set{border:2px solid var(--bd);border-radius:8px;padding:10px;background:var(--bg)}
.pic{height:60px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:6px}
.tag{display:inline-block;background:var(--yel);color:#161616;border:2px solid #161616;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
small,.m{color:var(--mut)}
h3{margin:0 0 8px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blu)}

.auth{grid-column:1/-1;justify-self:center;width:100%;max-width:420px}
.auth .big{display:block;width:120px;height:120px;margin:6px auto 12px;border-radius:16px;border:3px solid #161616;object-fit:cover}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}
nav{flex-wrap:wrap}nav button{min-width:30%}
a.tag{text-decoration:none;margin:0 4px 4px 0}
a.btn{display:inline-block;text-decoration:none;background:var(--red);color:#fff;border:3px solid #161616;border-radius:8px;padding:10px 16px;font-weight:800;box-shadow:0 3px 0 #161616;word-break:break-all}
nav button{touch-action:manipulation}nav button.sr{flex:none;min-width:0;padding:10px 14px;background:var(--card);color:var(--tx)}
.gp{height:60px;width:100%;object-fit:cover;border-radius:8px;margin-bottom:6px;display:block}
.gbig{width:84px;height:84px;border-radius:14px;object-fit:cover;border:3px solid #161616;flex:none;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:34px}
.gband{display:block;width:100%;height:150px;object-fit:cover;border-radius:8px;border:3px solid #161616;margin-bottom:10px}
.ti{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:2px solid #161616;background:#fff}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#161616;color:#fff;border-radius:10px;padding:10px 14px;display:none;z-index:9;text-align:center;max-width:600px;margin:auto}
.err{color:var(--red);font-weight:700}
.chk{display:inline-flex;width:16px;height:16px;border-radius:50%;background:#0b92d6;color:#fff;font-size:11px;font-weight:900;align-items:center;justify-content:center;vertical-align:middle;margin-left:4px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
</style></head><body>
<header><img class="logo" src="" alt="Lego Dreamer logo"><div><b>Lego Dreamer</b><small>Build it. Share it. Dream it.</small></div><div id="chip" class="chip" data-a="tab" data-v="profile" style="display:none"></div></header>
<nav id="nav"></nav>
<div id="tools"></div>
<main id="app"></main>
<div id="toast" role="status"></div>

 del:async function(v){var r=await SB.from("user_sets").delete().eq("id",v).select();if(r.error)return say(r.error.message);if(!r.data||!r.data.length)return say("Could not remove that set.");S.mine=S.mine.filter(function(x){return x.id!=v});S.promo=S.promo.filter(function(x){return x.id!=v});draw();say("Removed");load()},
 join:async function(v){var id=+v;if(S.joined.indexOf(id)>-1)ok(await SB.from("memberships").delete().eq("community_id",id).eq("user_id",S.me.id));else ok(await SB.from("memberships").insert({community_id:id}));await load()},
 check:async function(v){var u=S.users.filter(function(x){return x.id==v})[0];ok(await SB.rpc("set_verified",{target:v,v:!u.verified}));await load()},
 askdeact:function(v){var u=S.users.filter(function(x){return x.id==v})[0];S.dlg={id:v,username:u.username,act:u.status=="Suspended"?"Active":"Suspended"};draw();window.scrollTo(0,0)},
 canceldeact:function(){S.dlg=null;draw()},
 confirmdeact:async function(){var pw=$("dpw").value;if(!pw)return say("Enter your password.");
  var em=(await SB.auth.getUser()).data.user.email;var r=await SB.auth.signInWithPassword({email:em,password:pw});if(r.error)return say("Wrong password.");
  ok(await SB.rpc("set_status",{target:S.dlg.id,s:S.dlg.act}));S.dlg=null;await load();say("Done")},
 verify:async function(v){ok(await SB.from("owner_verifications").insert({owner_id:v}));await load()},
 mkowner:async function(v){ok(await SB.from("profiles").update({role:"owner"}).eq("id",v));await load()}
};
var CHG={
 urole:async function(v,e){ok(await SB.from("profiles").update({role:e.value}).eq("id",v));await load()},
 ustat:async function(v,e){ok(await SB.from("profiles").update({status:e.value}).eq("id",v));await load()}
};
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(b&&ACT[b.dataset.a])run(ACT[b.dataset.a])(b.dataset.v,b)});
document.addEventListener("input",function(e){if(e.target.id=="tq"){S.tq=e.target.value;$("tlist").innerHTML=tabList()}if(e.target.id=="mq"){S.mq=e.target.value;$("mlist").innerHTML=mlist()}if(e.target.id=="gn"){S.gnq=e.target.value;$("gmatch").innerHTML=gmatchHtml(S.gnq)}});
document.addEventListener("change",function(e){var b=e.target.closest("[data-c]");if(b&&CHG[b.dataset.c])run(CHG[b.dataset.c])(b.dataset.v,b)});
document.addEventListener("keydown",function(e){if(e.key=="Enter"&&(e.target.id=="fq"||e.target.id=="sn")){var b=document.querySelector(e.target.id=="fq"?"[data-a=figsearch]":"[data-a=addSet]");if(b)b.click();return}if(e.key=="Enter"&&e.target.closest(".auth")){var b=document.querySelector(".auth [data-a=login],.auth [data-a=signup]");if(b)b.click()}});
setInterval(function(){if(!document.hidden)pollNotes()},20000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)pollNotes()});
init().catch(function(e){say(e.message||"Could not connect.")});
</script></body></html>
